[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfalgo"
version = "0.1.0"
description = "Trend-following backtester for Indian mid/small-cap equities (chart-only, OOP, prod-ready interfaces)"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "tzdata",
  "numpy>=1.26",
  "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pytest-cov", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
tfalgo = "tfalgo.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["tfalgo.strategy.*", "tfalgo.execution.*"]
strict = true
